             *
             * @example
             *     for await (const chunk of client.decisions.iterCreateChunked({
             *         file: { path: "call.mp3" },
             *         request: {
             *             questions: {
             *                 "agent_glitches": {
             *                     type: "moment",
             *                     instructions: "Where does the agent glitch, slur or sound robotic?"
             *                 }
             *             }
             *         },
             *         maxChunkMs: 300000
             *     })) {
             *         if (chunk.status === "succeeded") {
             *             console.log(chunk.startMs, chunk.response.runId);
             *         } else {
             *             console.log(chunk.startMs, chunk.status, chunk.error);
             *         }
             *     }
             */
            public iterCreateChunked(
                request: Decisions.DecisionsUpload & iterAudioChunks.Options,
                requestOptions?: DecisionsClient.RequestOptions,
            ): AsyncGenerator<ChunkResult, void, undefined> {
                return sendChunks((upload) => this.create(upload, requestOptions), request, requestOptions?.abortSignal);
            }

            /**
             * Cuts a recording longer than `create` accepts into chunks, sends each chunk to the model in its own `create` request, and resolves with every chunk's result once all are done. The model hears only its chunk, so every answer describes its chunk alone, and each request has its own `runId` and its own billing. {@link DecisionsClient.iterCreateChunked} describes how the chunks are cut and sent, the memory the job uses, and which failures stop it. If the process stops partway through, the responses already received are lost although they were billed, so use `iterCreateChunked` to keep each response as it arrives.
