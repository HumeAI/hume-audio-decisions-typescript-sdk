            const keepTimeoutUntilBodyRead =
                args.responseType !== "streaming" && args.responseType !== "sse" && args.responseType !== "binary-response";
            const attemptResponses: Response[] = [];
            try {
                const response = await requestWithRetries(
                    async () => {
                        // A retry means the previous attempt is over; stop its timer now rather than at the end.
                        for (const previousResponse of attemptResponses) {
                            clearResponseTimeout(previousResponse);
                        }
                        const attemptResponse = await makeRequest(
                            fetchFn,
                            url,
                            args.method,
                            headers,
                            requestBody,
                            args.timeoutMs,
                            args.abortSignal,
                            args.withCredentials,
                            args.duplex,
                            args.responseType === "streaming" || args.responseType === "sse",
                            keepTimeoutUntilBodyRead,
                        );
                        attemptResponses.push(attemptResponse);
                        return attemptResponse;
                    },
                    args.maxRetries,
                    args.abortSignal,
                );

                if (response.status >= 200 && response.status < 300) {
                    if (logger.isDebug()) {
                        const metadata = {
                            method: args.method,
                            url: redactUrl(url),
                            statusCode: response.status,
                            responseHeaders: redactHeaders(response.headers),
                        };
                        logger.debug("HTTP request succeeded", metadata);
                    }
                    if (args.responseType == null || args.responseType === "json") {
                        const read = await readJsonObject(response);
                        if (!read.ok) {
                            return {
                                ok: false,
                                error: { reason: "non-json", statusCode: response.status, rawBody: read.rawBody },
                                rawResponse: toRawResponse(response),
                            };
                        }
                        return {
                            ok: true,
                            body: read.body as R,
                            headers: response.headers,
                            rawResponse: toRawResponse(response),
                        };
                    }
                    const body = await getResponseBody(response, args.responseType);
                    return {
                        ok: true,
                        body: body as R,
                        headers: response.headers,
                        rawResponse: toRawResponse(response),
                    };
                } else {
                    if (logger.isError()) {
                        const metadata = {
                            method: args.method,
                            url: redactUrl(url),
                            statusCode: response.status,
                            responseHeaders: redactHeaders(Object.fromEntries(response.headers.entries())),
                        };
                        logger.error("HTTP request failed with error status", metadata);
                    }
                    // The endpoints parse the body of an error status they document as the API's error object, which
                    // throws for any other body and loses the status, so such a body is reported with its raw text.
                    const read = await readJsonObject(response);
                    return {
                        ok: false,
                        error: read.ok
                            ? { reason: "status-code", statusCode: response.status, body: read.body }
                            : { reason: "non-json", statusCode: response.status, rawBody: read.rawBody },
                        rawResponse: toRawResponse(response),
                    };
                }
            } catch (error) {
                if (args.abortSignal?.aborted) {
                    if (logger.isError()) {
                        const metadata = {
                            method: args.method,
                            url: redactUrl(url),
                        };
                        logger.error("HTTP request was aborted", metadata);
                    }
                    return {
                        ok: false,
                        error: {
                            reason: "unknown",
                            errorMessage: "The user aborted a request",
                            cause: error,
                        },
                        rawResponse: abortRawResponse,
                    };
