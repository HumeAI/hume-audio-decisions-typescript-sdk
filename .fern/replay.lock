                            level: "error",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(result.ok).toBe(false);
                    expect(mockLogger.error).toHaveBeenCalledWith(
                        "HTTP request timed out",
                        expect.objectContaining({
                            method: "GET",
                            url: "https://example.com/api",
                            timeoutMs: undefined,
                        }),
                    );
                });

                it("should log unknown errors", async () => {
                    const mockLogger = createMockLogger();

                    const unknownError = new Error("Unknown error");

                    global.fetch = vi.fn().mockRejectedValue(unknownError);

                    const result = await fetcherImpl({
                        url: "https://example.com/api",
                        method: "GET",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "error",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(result.ok).toBe(false);
                    expect(mockLogger.error).toHaveBeenCalledWith(
                        "HTTP request failed with error",
                        expect.objectContaining({
                            method: "GET",
                            url: "https://example.com/api",
                            errorMessage: "Unknown error",
                        }),
                    );
                });
            });

            describe("Logging with Redaction", () => {
                it("should redact sensitive data in error logs", async () => {
                    const mockLogger = createMockLogger();
                    mockErrorResponse({ error: "Unauthorized" }, 401, "Unauthorized");

                    await fetcherImpl({
                        url: "https://example.com/api?api_key=secret",
                        method: "GET",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "error",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.error).toHaveBeenCalledWith(
                        "HTTP request failed with error status",
                        expect.objectContaining({
                            url: "https://example.com/api?api_key=[REDACTED]",
                        }),
                    );
                });
            });

            describe("Different HTTP Methods", () => {
                it("should log GET requests", async () => {
                    const mockLogger = createMockLogger();
                    mockSuccessResponse();

                    await fetcherImpl({
                        url: "https://example.com/api",
                        method: "GET",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "debug",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.debug).toHaveBeenCalledWith(
                        "Making HTTP request",
                        expect.objectContaining({
                            method: "GET",
                        }),
                    );
                });

                it("should log POST requests", async () => {
                    const mockLogger = createMockLogger();
                    mockSuccessResponse({ data: "test" }, 201, "Created");

                    await fetcherImpl({
                        url: "https://example.com/api",
                        method: "POST",
                        body: { data: "test" },
                        contentType: "application/json",
                        requestType: "json",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "debug",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.debug).toHaveBeenCalledWith(
                        "Making HTTP request",
                        expect.objectContaining({
                            method: "POST",
                        }),
                    );
                });

                it("should log PUT requests", async () => {
                    const mockLogger = createMockLogger();
                    mockSuccessResponse();

                    await fetcherImpl({
                        url: "https://example.com/api",
                        method: "PUT",
                        body: { data: "test" },
                        contentType: "application/json",
                        requestType: "json",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "debug",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.debug).toHaveBeenCalledWith(
                        "Making HTTP request",
                        expect.objectContaining({
                            method: "PUT",
                        }),
                    );
                });

                it("should log DELETE requests", async () => {
                    const mockLogger = createMockLogger();
                    global.fetch = vi.fn().mockResolvedValue(
                        new Response(null, {
                            status: 200,
                            statusText: "OK",
                        }),
                    );

                    await fetcherImpl({
                        url: "https://example.com/api",
                        method: "DELETE",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "debug",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.debug).toHaveBeenCalledWith(
                        "Making HTTP request",
                        expect.objectContaining({
                            method: "DELETE",
                        }),
                    );
                });
            });

            describe("Status Code Logging", () => {
                it("should log 2xx success status codes", async () => {
                    const mockLogger = createMockLogger();
                    mockSuccessResponse({ data: "test" }, 201, "Created");

                    await fetcherImpl({
                        url: "https://example.com/api",
                        method: "POST",
                        body: { data: "test" },
                        contentType: "application/json",
                        requestType: "json",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "debug",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.debug).toHaveBeenCalledWith(
                        "HTTP request succeeded",
                        expect.objectContaining({
                            statusCode: 201,
                        }),
                    );
                });

                it("should log 3xx redirect status codes as errors", async () => {
                    const mockLogger = createMockLogger();
                    mockSuccessResponse({ data: "test" }, 301, "Moved Permanently");

                    await fetcherImpl({
                        url: "https://example.com/api",
                        method: "GET",
                        responseType: "json",
                        maxRetries: 0,
                        logging: {
                            level: "error",
                            logger: mockLogger,
                            silent: false,
                        },
                    });

                    expect(mockLogger.error).toHaveBeenCalledWith(
                        "HTTP request failed with error status",
                        expect.objectContaining({
                            statusCode: 301,
                        }),
                    );
                });
            });
        });
