                        const metadata = {
                            method: args.method,
                            url: redactUrl(url),
                            timeoutMs: args.timeoutMs,
                        };
                        logger.error("HTTP request timed out", metadata);
                    }
                    return {
                        ok: false,
                        error: {
                            reason: "timeout",
                            cause: error,
                        },
                        rawResponse: abortRawResponse,
                    };
                } else if (error instanceof Error) {
                    if (logger.isError()) {
                        const metadata = {
                            method: args.method,
                            url: redactUrl(url),
                            errorMessage: error.message,
                        };
                        logger.error("HTTP request failed with error", metadata);
                    }
                    return {
                        ok: false,
                        error: {
                            reason: "unknown",
                            errorMessage: error.message,
                            cause: error,
                        },
                        rawResponse: unknownRawResponse,
                    };
                }

                if (logger.isError()) {
                    const metadata = {
                        method: args.method,
                        url: redactUrl(url),
                        error: toJson(error),
                    };
                    logger.error("HTTP request failed with unknown error", metadata);
                }
                return {
                    ok: false,
                    error: {
                        reason: "unknown",
                        errorMessage: toJson(error),
                        cause: error,
                    },
                    rawResponse: unknownRawResponse,
                };
